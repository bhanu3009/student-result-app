<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2 id="welcomeMessage">Loading Dashboard...</h2>
        <button id="logoutBtn" class="danger-btn">Logout</button>
    </nav>

    <main class="dashboard-container">
        
        <section class="card control-panel">
            <h3>Admin Controls</h3>
            
            <form id="subjectForm" class="admin-form">
                <h4>Add Subject</h4>
                <input type="text" id="subjName" placeholder="Subject Name (e.g. Cyber Law)" required>
                <button type="submit">Add Subject</button>
            </form>

            <hr>

            <form id="studentForm" class="admin-form">
                <h4>Add Student</h4>
                <input type="text" id="stuName" placeholder="Full Name" required>
                <input type="text" id="stuRoll" placeholder="Roll Number" required>
                <input type="text" id="stuClass" placeholder="Class/Year" required>
                <button type="submit">Add Student</button>
            </form>

            <hr>

            <form id="resultForm" class="admin-form">
                <h4>Assign Result</h4>
                <input type="number" id="resStudentId" placeholder="Student ID (Number)" required>
                <input type="number" id="resSubjectId" placeholder="Subject ID (Number)" required>
                <input type="number" id="resMarks" placeholder="Marks (0-100)" required>
                <button type="submit">Save Score</button>
            </form>
        </section>

        <section class="card">
            <h3>Registered Students</h3>
            <ul id="studentsList">Loading students...</ul>
        </section>

        <section class="card">
            <h3>Available Subjects</h3>
            <ul id="subjectsList">Loading subjects...</ul>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
